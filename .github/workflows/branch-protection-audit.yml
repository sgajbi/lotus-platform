name: Branch Protection Audit

# The daily supplement is deliberately absent until an administration-read
# credential exists. The branch protection endpoint refuses `github.token`, so a
# scheduled run today would fail in `gh api` before comparing a single field and
# leave a permanently red workflow, which teaches readers to ignore red. Manual
# dispatch stays, so an operator holding a token can run the comparison now.
#
# Restoring the schedule and adding the blocking pre-merge lane are tracked
# together in the follow-up issue named in `quality/branch_protection_policy.v1.json`.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    name: Audit / Live Protection Matches Policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compare live branch protection against policy (fail closed)
        env:
          # github.token cannot carry administration:read, which the branch
          # protection endpoint requires. This secret is not provisioned in any
          # Lotus repository yet, so this step fails closed until an operator
          # creates it. A blocking pre-merge step before then would deadlock
          # every pull request on that operator action.
          GH_TOKEN: ${{ secrets.LOTUS_AUTOMERGE_TOKEN }}
        # Invoked bare on purpose: piping through tee reports tee's exit code
        # and would make this gate incapable of failing.
        run: python automation/check_branch_protection_policy.py
