name: Core Performance Cross-App Validation

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Cross-app validation target to run."
        type: choice
        required: true
        default: baseline
        options:
          - baseline
          - twr_benchmark
          - returns_series
          - contribution
          - attribution
          - mwr
      scenario_mode:
        description: "Use a fresh seeded scenario or reuse an existing stable scenario on the runner."
        type: choice
        required: true
        default: skip_seed
        options:
          - skip_seed
          - fresh_seed
      shared_scenario_suffix:
        description: "Optional shared scenario suffix for TWR, returns-series, contribution, attribution, or baseline."
        type: string
        required: false
      mwr_scenario_suffix:
        description: "Optional MWR scenario suffix for MWR or baseline."
        type: string
        required: false
      core_ingestion_base_url:
        description: "lotus-core ingestion base URL visible from the runner."
        type: string
        required: true
        default: "http://127.0.0.1:8200"
      core_query_base_url:
        description: "lotus-core query base URL visible from the runner."
        type: string
        required: true
        default: "http://127.0.0.1:8202"
      performance_base_url:
        description: "lotus-performance base URL visible from the runner."
        type: string
        required: true
        default: "http://127.0.0.1:8002"

permissions:
  contents: read

jobs:
  cross-app-validation:
    name: Run ${{ inputs.target }} validator
    runs-on: self-hosted
    steps:
      - name: Checkout lotus-platform
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Run cross-app validation
        shell: pwsh
        run: |
          $args = @(
            "automation/core_performance_ci_entrypoint.py",
            "--target", "${{ inputs.target }}",
            "--scenario-mode", "${{ inputs.scenario_mode }}",
            "--core-ingestion-base-url", "${{ inputs.core_ingestion_base_url }}",
            "--core-query-base-url", "${{ inputs.core_query_base_url }}",
            "--performance-base-url", "${{ inputs.performance_base_url }}"
          )

          if ("${{ inputs.shared_scenario_suffix }}") {
            $args += @("--shared-scenario-suffix", "${{ inputs.shared_scenario_suffix }}")
          }

          if ("${{ inputs.mwr_scenario_suffix }}") {
            $args += @("--mwr-scenario-suffix", "${{ inputs.mwr_scenario_suffix }}")
          }

          python @args

      - name: Append markdown evidence to workflow summary
        if: always()
        shell: pwsh
        run: |
          $artifactRoot = Join-Path $PWD "output/cross-app"
          $markdownMap = @{
            "baseline" = "core-performance-baseline-validation.md"
            "twr_benchmark" = "core-performance-twr-benchmark-validation.md"
            "returns_series" = "core-performance-returns-series-validation.md"
            "contribution" = "core-performance-contribution-validation.md"
            "attribution" = "core-performance-attribution-validation.md"
            "mwr" = "core-performance-mwr-validation.md"
          }
          $markdownPath = Join-Path $artifactRoot $markdownMap["${{ inputs.target }}"]
          if (Test-Path $markdownPath) {
            Get-Content $markdownPath | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            "No markdown artifact was produced for target `${{ inputs.target }}`." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-app-validation-${{ inputs.target }}-${{ github.run_id }}
          path: |
            output/cross-app/*.json
            output/cross-app/*.md
          if-no-files-found: warn
