name: Remote Feature Lane

on:
  push:
    branches-ignore: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-lint:
    name: Feature Lane / Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-actionlint@v1

  repo-contracts:
    name: Feature Lane / Platform Repo Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout governed domain-product source repositories
        uses: actions/checkout@v7
        with:
          repository: sgajbi/lotus-core
          path: _federated/lotus-core
      - uses: actions/checkout@v7
        with:
          repository: sgajbi/lotus-performance
          path: _federated/lotus-performance
      - uses: actions/checkout@v7
        with:
          repository: sgajbi/lotus-risk
          path: _federated/lotus-risk
      - uses: actions/checkout@v7
        with:
          repository: sgajbi/lotus-advise
          path: _federated/lotus-advise
      - uses: actions/checkout@v7
        with:
          repository: sgajbi/lotus-report
          path: _federated/lotus-report
      - uses: actions/checkout@v7
        with:
          repository: sgajbi/lotus-manage
          path: _federated/lotus-manage
      - name: Link governed source repositories into federated workspace
        shell: bash
        run: |
          for repo in lotus-core lotus-performance lotus-risk lotus-advise lotus-report lotus-manage; do
            ln -s "$GITHUB_WORKSPACE/_federated/$repo" "$GITHUB_WORKSPACE/../$repo"
          done
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run platform feature-lane checks
        shell: pwsh
        run: |
          & .\automation\Invoke-PlatformRepoChecks.ps1 -Lane feature
      - name: Run platform demo-readiness certification (report-only)
        shell: pwsh
        continue-on-error: true
        run: |
          & .\automation\Invoke-PlatformDemoReadinessCertification.ps1 -ScenarioMode fresh_seed
      - name: Upload platform demo-readiness certification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-demo-readiness-certification
          path: output/demo-readiness/platform/
