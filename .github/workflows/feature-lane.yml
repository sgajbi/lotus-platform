name: Remote Feature Lane

on:
  push:
    branches-ignore: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-lint:
    name: Feature Lane / Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: reviewdog/action-actionlint@v1

  repo-contracts:
    name: Feature Lane / Platform Repo Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run platform feature-lane checks
        shell: pwsh
        run: |
          & .\automation\Invoke-PlatformRepoChecks.ps1 -Lane feature
