name: Main Releasability Gate

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Optional merged pull-request SHA that this run must validate."
        required: false
        type: string
      triggering_pr:
        description: "Optional pull request number that dispatched this mainline validation."
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.expected_sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: "init.defaultBranch"
  GIT_CONFIG_VALUE_0: "main"

jobs:
  exact-revision-assertion:
    name: Main Releasability / Exact Revision Assertion
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Assert expected merged PR SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          TRIGGERING_PR: ${{ inputs.triggering_pr }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [ -z "$EXPECTED_SHA" ]; then
            echo "No expected_sha input supplied; treating this as an operator-dispatched main releasability run."
            exit 0
          fi
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::Main releasability checkout SHA $actual_sha does not match expected merged PR SHA $EXPECTED_SHA for PR ${TRIGGERING_PR:-unknown}."
            exit 1
          fi
          echo "Validated exact merged PR SHA $EXPECTED_SHA for PR ${TRIGGERING_PR:-unknown}."

  workflow-lint:
    name: Main Releasability / Workflow Lint
    needs: [exact-revision-assertion]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-actionlint@v1

  repo-contracts:
    name: Main Releasability / Platform Repo Contracts
    needs: [exact-revision-assertion]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Checkout governed domain-product source repositories
        uses: actions/checkout@v7
        with:
          repository: sgajbi/lotus-core
          path: _federated/lotus-core
      - uses: actions/checkout@v7
        with:
          repository: sgajbi/lotus-performance
          path: _federated/lotus-performance
      - uses: actions/checkout@v7
        with:
          repository: sgajbi/lotus-risk
          path: _federated/lotus-risk
      - uses: actions/checkout@v7
        with:
          repository: sgajbi/lotus-advise
          path: _federated/lotus-advise
      - uses: actions/checkout@v7
        with:
          repository: sgajbi/lotus-report
          path: _federated/lotus-report
      - uses: actions/checkout@v7
        with:
          repository: sgajbi/lotus-render
          path: _federated/lotus-render
      - uses: actions/checkout@v7
        with:
          repository: sgajbi/lotus-archive
          path: _federated/lotus-archive
      - uses: actions/checkout@v7
        with:
          repository: sgajbi/lotus-manage
          path: _federated/lotus-manage
      - uses: actions/checkout@v7
        with:
          repository: sgajbi/lotus-idea
          path: _federated/lotus-idea
      - uses: actions/checkout@v7
        with:
          repository: sgajbi/lotus-ai
          path: _federated/lotus-ai
      - uses: actions/checkout@v7
        with:
          repository: sgajbi/lotus-gateway
          path: _federated/lotus-gateway
      - uses: actions/checkout@v7
        with:
          repository: sgajbi/lotus-workbench
          path: _federated/lotus-workbench
      - name: Link governed source repositories into federated workspace
        shell: bash
        run: |
          for repo in lotus-core lotus-performance lotus-risk lotus-advise lotus-report lotus-render lotus-archive lotus-manage lotus-idea lotus-ai lotus-gateway lotus-workbench; do
            ln -s "$GITHUB_WORKSPACE/_federated/$repo" "$GITHUB_WORKSPACE/../$repo"
          done
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run platform main-releasability checks
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          LOTUS_BRANCH_SIGNATURES_REQUIRED: "false"
        run: |
          & .\automation\Invoke-PlatformRepoChecks.ps1 -Lane main-releasability
