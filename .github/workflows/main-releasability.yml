name: Main Releasability Gate

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-lint:
    name: Main Releasability / Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: reviewdog/action-actionlint@v1

  repo-contracts:
    name: Main Releasability / Platform Repo Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run platform main-releasability checks
        shell: pwsh
        run: |
          & .\automation\Invoke-PlatformRepoChecks.ps1 -Lane main-releasability
