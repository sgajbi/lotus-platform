name: Pull Request Merge Gate

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: "init.defaultBranch"
  GIT_CONFIG_VALUE_0: "main"

jobs:
  workflow-lint:
    name: PR Merge Gate / Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-actionlint@v1

  repo-contracts:
    name: PR Merge Gate / Platform Repo Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Checkout governed domain-product source repositories
        uses: actions/checkout@v7
        with:
          repository: sgajbi/lotus-core
          path: _federated/lotus-core
      - uses: actions/checkout@v7
        with:
          repository: sgajbi/lotus-performance
          path: _federated/lotus-performance
      - uses: actions/checkout@v7
        with:
          repository: sgajbi/lotus-risk
          path: _federated/lotus-risk
      - uses: actions/checkout@v7
        with:
          repository: sgajbi/lotus-advise
          path: _federated/lotus-advise
      - uses: actions/checkout@v7
        with:
          repository: sgajbi/lotus-report
          path: _federated/lotus-report
      - uses: actions/checkout@v7
        with:
          repository: sgajbi/lotus-render
          path: _federated/lotus-render
      - uses: actions/checkout@v7
        with:
          repository: sgajbi/lotus-archive
          path: _federated/lotus-archive
      - uses: actions/checkout@v7
        with:
          repository: sgajbi/lotus-manage
          path: _federated/lotus-manage
      - uses: actions/checkout@v7
        with:
          repository: sgajbi/lotus-idea
          path: _federated/lotus-idea
      - name: Link governed source repositories into federated workspace
        shell: bash
        run: |
          for repo in lotus-core lotus-performance lotus-risk lotus-advise lotus-report lotus-render lotus-archive lotus-manage lotus-idea; do
            ln -s "$GITHUB_WORKSPACE/_federated/$repo" "$GITHUB_WORKSPACE/../$repo"
          done
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run platform PR-merge checks
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          LOTUS_PROVENANCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          & .\automation\Invoke-PlatformRepoChecks.ps1 -Lane pr-merge
