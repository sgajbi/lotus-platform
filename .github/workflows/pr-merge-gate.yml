name: Pull Request Merge Gate

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-lint:
    name: PR Merge Gate / Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: reviewdog/action-actionlint@v1

  repo-contracts:
    name: PR Merge Gate / Platform Repo Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Checkout governed domain-product source repositories
        uses: actions/checkout@v6
        with:
          repository: sgajbi/lotus-core
          path: ../lotus-core
      - uses: actions/checkout@v6
        with:
          repository: sgajbi/lotus-performance
          path: ../lotus-performance
      - uses: actions/checkout@v6
        with:
          repository: sgajbi/lotus-risk
          path: ../lotus-risk
      - uses: actions/checkout@v6
        with:
          repository: sgajbi/lotus-advise
          path: ../lotus-advise
      - uses: actions/checkout@v6
        with:
          repository: sgajbi/lotus-report
          path: ../lotus-report
      - uses: actions/checkout@v6
        with:
          repository: sgajbi/lotus-manage
          path: ../lotus-manage
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run platform PR-merge checks
        shell: pwsh
        run: |
          & .\automation\Invoke-PlatformRepoChecks.ps1 -Lane pr-merge
