interface:
  display_name: "Lotus App Issue Discovery"
  short_description: "Evidence-backed issue discovery across Lotus app quality lenses."
  default_prompt: "Review a Lotus app lens by lens using docs repo knowledge, Lotus platform context, repository context, and backend refactoring standards. Maintain or update the GitHub coverage ledger, ensure canonical lens labels exist, inspect code/tests/docs/contracts before making claims, search duplicates with lens and symbol terms, avoid wrong-owner findings, and raise only high-value GitHub issues with concrete evidence, related-issue context, expected direction, and testable acceptance criteria. When a repeated review weakness appears, update the platform-owned skill or context rather than relying on memory."
