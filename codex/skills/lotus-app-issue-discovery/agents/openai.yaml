interface:
  display_name: "Lotus App Issue Discovery"
  short_description: "Ledger-first, evidence-backed issue discovery across Lotus app quality lenses."
  default_prompt: "Use $lotus-app-issue-discovery to run governed Lotus app issue discovery with code-backed evidence, duplicate checks, ledger updates, and the requested lens. For combined discovery-and-fix work, create or reuse the focused GitHub issue and record the ledger checkpoint before handing off to the applicable delivery skill or mutating source. For bank-readiness work, map findings to the canonical BR-NNN control, repository profile, environment layer, status, maturity, actual evidence class, and owner without inferring certification. Include API standards, remote hygiene, CI, docs/context, threat modeling, identity, container hardening, vulnerability and incident posture, DR, rollout, tenant/privacy, accessibility, and AI governance when relevant."
