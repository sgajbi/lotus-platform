interface:
  display_name: "Lotus App Issue Discovery"
  short_description: "Ledger-first, evidence-backed issue discovery across Lotus app quality lenses."
  default_prompt: "Run a governed Lotus app issue-discovery campaign in autopilot mode. Assume no prior chat context: reconstruct target repo, GitHub owner/repo, branch, dirty worktree posture, open PRs, current issue-discovery issues, and the app ledger before choosing a lens. Protect local worktree changes, read the campaign playbook and lens catalog, choose one lens from the user's request, ledger gaps, repository review profile, or baseline queue, then load only the repo/platform/docs context needed for that lens. Inspect source plus a test/doc/contract/workflow counterpart before making claims, build an evidence packet, run the gold gate for high-impact findings, search duplicates with broad lens terms and concrete symbols, ensure canonical labels exist, and raise only high-value GitHub issues with standards-backed evidence, owner-boundary rationale, expected direction, and testable acceptance criteria. Update the ledger after every pass with proof flags, inspected paths, duplicate searches, issues, active blockers, residual risk, and a continue/pause/recheck/move-app recommendation. Treat requested issue counts as ceilings, not quotas, and promote repeated review lessons into the platform-owned skill or context instead of relying on memory."
