interface:
  display_name: "Lotus App Issue Discovery"
  short_description: "Ledger-first, evidence-backed issue discovery across Lotus app quality lenses."
  default_prompt: "Use $lotus-app-issue-discovery to run governed Lotus app issue discovery with code-backed evidence, duplicate checks, ledger updates, and the requested lens. For combined discovery-and-fix work, create or reuse the focused GitHub issue and record the ledger checkpoint before handing off to the applicable delivery skill or mutating source. Include API documentation/standards, duplicate endpoint posture, remote repo hygiene, stale feature branches, repo description correctness, CI, docs, agent-context quality, enterprise readiness, accessibility/usability, compliance, DR, rollout, tenant isolation, data privacy, and AI governance/evaluation/safety/tool-control quality when relevant."
