interface:
  display_name: "Lotus App Issue Discovery"
  short_description: "Evidence-backed issue discovery across Lotus app quality lenses."
  default_prompt: "Run a governed Lotus app issue-discovery campaign. Infer or confirm the target repo, find or create the GitHub issue-discovery ledger, choose the next lens from the ledger and baseline queue, load the smallest relevant docs/platform/repo context, inspect code/tests/docs/contracts before making claims, search duplicates with lens and symbol terms, ensure canonical labels exist, and raise only high-value GitHub issues with concrete evidence, related issue context, expected direction, and testable acceptance criteria. Update the ledger after every pass, including no-issue and blocked-by-active-fix outcomes. When a repeated review weakness appears, update the platform-owned skill or context rather than relying on memory."
