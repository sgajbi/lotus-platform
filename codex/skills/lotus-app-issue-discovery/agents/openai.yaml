interface:
  display_name: "Lotus App Issue Discovery"
  short_description: "Ledger-first, evidence-backed issue discovery across Lotus app quality lenses."
  default_prompt: "Run a governed Lotus app issue-discovery campaign. Infer or confirm the target repo and GitHub issue target, protect local worktree changes, find or create the issue-discovery ledger, read the campaign playbook, choose one lens from the ledger/baseline queue/user request, load the smallest relevant repo/platform/docs context, inspect source/tests/docs/contracts/workflows before making claims, build an evidence packet, search duplicates with broad lens terms and concrete symbols, ensure canonical labels exist, and raise only high-value GitHub issues with standards-backed evidence, owner-boundary rationale, expected direction, and testable acceptance criteria. Update the ledger after every pass, including no-issue, residual-risk, and blocked-by-active-fix outcomes, and use it to answer whether to continue or move to another app. Promote repeated review lessons into the platform-owned skill or context instead of relying on memory."
