services:
  lotus-core-query:
    ports:
      - "127.0.0.1:${LOTUS_CORE_QUERY_PORT:-8201}:8001"

  lotus-core-ingestion:
    ports:
      - "127.0.0.1:${LOTUS_CORE_INGESTION_PORT:-8200}:8000"

  lotus-manage:
    ports:
      - "127.0.0.1:${LOTUS_MANAGE_PORT:-8000}:8000"

  lotus-performance:
    ports:
      - "127.0.0.1:${LOTUS_PERFORMANCE_PORT:-8002}:8000"

  lotus-report:
    ports:
      - "127.0.0.1:${LOTUS_REPORT_PORT:-8300}:8300"

  lotus-gateway:
    ports:
      - "127.0.0.1:${LOTUS_GATEWAY_PORT:-8100}:8100"

  lotus-workbench:
    ports:
      - "127.0.0.1:${LOTUS_WORKBENCH_PORT:-3000}:3000"

  prometheus:
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9190}:9090"

  grafana:
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3300}:3000"
