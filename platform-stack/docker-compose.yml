name: lotus-platform

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-small-service: &small-service
  cpus: "0.50"
  mem_limit: 256m

x-medium-service: &medium-service
  cpus: "1.00"
  mem_limit: 512m

x-large-service: &large-service
  cpus: "2.00"
  mem_limit: 1g

services:
  dev-ingress:
    <<: *small-service
    image: caddy:2.8.4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      lotus-workbench:
        condition: service_healthy
      lotus-gateway:
        condition: service_healthy
      lotus-manage:
        condition: service_healthy
      lotus-core-query:
        condition: service_healthy
      lotus-core-control:
        condition: service_healthy
      lotus-core-ingestion:
        condition: service_healthy
      lotus-performance:
        condition: service_healthy
      lotus-report:
        condition: service_healthy
      lotus-idea:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DEV_INGRESS_HTTP_PORT:-80}:80"
    volumes:
      - ./dev-ingress/Caddyfile:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s
    logging: *default-logging

  zookeeper:
    <<: *medium-service
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: "ruok,stat,mntr,conf"
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok,stat,mntr,conf"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    logging: *default-logging

  kafka:
    <<: *large-service
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9093,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:9093 --list || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *default-logging

  lotus-core-postgres:
    <<: *medium-service
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${LOTUS_CORE_POSTGRES_DB:-portfolio_db}
      POSTGRES_USER: ${LOTUS_CORE_POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${LOTUS_CORE_POSTGRES_PASSWORD:?run platform-stack/bootstrap.ps1 or bootstrap.sh}
    volumes:
      - lotus-core-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
    logging: *default-logging

  lotus-manage-postgres:
    <<: *medium-service
    image: postgres:17.6
    environment:
      POSTGRES_DB: ${LOTUS_MANAGE_POSTGRES_DB:-lotus_manage}
      POSTGRES_USER: ${LOTUS_MANAGE_POSTGRES_USER:-lotus_manage}
      POSTGRES_PASSWORD: ${LOTUS_MANAGE_POSTGRES_PASSWORD:?run platform-stack/bootstrap.ps1 or bootstrap.sh}
    volumes:
      - lotus-manage-postgres-identity-v2-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
    logging: *default-logging

  lotus-report-postgres:
    <<: *medium-service
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${LOTUS_REPORT_POSTGRES_DB:-lotus_report}
      POSTGRES_USER: ${LOTUS_REPORT_POSTGRES_USER:-lotus_report}
      POSTGRES_PASSWORD: ${LOTUS_REPORT_POSTGRES_PASSWORD:?run platform-stack/bootstrap.ps1 or bootstrap.sh}
    volumes:
      - lotus-report-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
    logging: *default-logging

  lotus-core-kafka-topic-creator:
    build:
      context: ${LOTUS_CORE_REPO_PATH}
      dockerfile: ./src/services/persistence_service/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
    command: ["python", "-m", "tools.kafka_setup"]
    restart: "no"
    logging: *default-logging

  lotus-core-migration-runner:
    build:
      context: ${LOTUS_CORE_REPO_PATH}
      dockerfile: ./src/services/persistence_service/Dockerfile
    depends_on:
      lotus-core-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${LOTUS_CORE_POSTGRES_USER:-user}:${LOTUS_CORE_POSTGRES_PASSWORD:?run platform-stack/bootstrap.ps1 or bootstrap.sh}@lotus-core-postgres:5432/${LOTUS_CORE_POSTGRES_DB:-portfolio_db}
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    logging: *default-logging

  lotus-core-query:
    <<: *medium-service
    build:
      context: ${LOTUS_CORE_REPO_PATH}
      dockerfile: ./src/services/query_service/Dockerfile
    depends_on:
      lotus-core-migration-runner:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${LOTUS_CORE_POSTGRES_USER:-user}:${LOTUS_CORE_POSTGRES_PASSWORD:?run platform-stack/bootstrap.ps1 or bootstrap.sh}@lotus-core-postgres:5432/${LOTUS_CORE_POSTGRES_DB:-portfolio_db}
      OTEL_SERVICE_NAME: lotus-core-query
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=5)"]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 20s
    logging: *default-logging

  lotus-core-control:
    <<: *medium-service
    build:
      context: ${LOTUS_CORE_REPO_PATH}
      dockerfile: ./src/services/query_control_plane_service/Dockerfile
    depends_on:
      lotus-core-migration-runner:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${LOTUS_CORE_POSTGRES_USER:-user}:${LOTUS_CORE_POSTGRES_PASSWORD:?run platform-stack/bootstrap.ps1 or bootstrap.sh}@lotus-core-postgres:5432/${LOTUS_CORE_POSTGRES_DB:-portfolio_db}
      OTEL_SERVICE_NAME: lotus-core-control
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8002"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health/ready', timeout=5)"]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 20s
    logging: *default-logging

  lotus-core-ingestion:
    <<: *medium-service
    build:
      context: ${LOTUS_CORE_REPO_PATH}
      dockerfile: ./src/services/ingestion_service/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      lotus-core-kafka-topic-creator:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      OTEL_SERVICE_NAME: lotus-core-ingestion
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 25s
    logging: *default-logging

  lotus-manage:
    <<: *medium-service
    build:
      context: ${LOTUS_MANAGE_REPO_PATH}
      dockerfile: Dockerfile
    depends_on:
      lotus-manage-postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      APP_PERSISTENCE_PROFILE: PRODUCTION
      DPM_SUPPORTABILITY_STORE_BACKEND: POSTGRES
      DPM_SUPPORTABILITY_POSTGRES_DSN: postgresql://${LOTUS_MANAGE_POSTGRES_USER:-lotus_manage}:${LOTUS_MANAGE_POSTGRES_PASSWORD:?run platform-stack/bootstrap.ps1 or bootstrap.sh}@lotus-manage-postgres:5432/${LOTUS_MANAGE_POSTGRES_DB:-lotus_manage}
      PROPOSAL_STORE_BACKEND: POSTGRES
      PROPOSAL_POSTGRES_DSN: postgresql://${LOTUS_MANAGE_POSTGRES_USER:-lotus_manage}:${LOTUS_MANAGE_POSTGRES_PASSWORD:?run platform-stack/bootstrap.ps1 or bootstrap.sh}@lotus-manage-postgres:5432/${LOTUS_MANAGE_POSTGRES_DB:-lotus_manage}
      DPM_POLICY_PACK_CATALOG_BACKEND: POSTGRES
      DPM_POLICY_PACK_POSTGRES_DSN: postgresql://${LOTUS_MANAGE_POSTGRES_USER:-lotus_manage}:${LOTUS_MANAGE_POSTGRES_PASSWORD:?run platform-stack/bootstrap.ps1 or bootstrap.sh}@lotus-manage-postgres:5432/${LOTUS_MANAGE_POSTGRES_DB:-lotus_manage}
      OTEL_SERVICE_NAME: lotus-manage
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 20s
    logging: *default-logging

  lotus-performance:
    <<: *medium-service
    build:
      context: ${LOTUS_PERFORMANCE_REPO_PATH}
      dockerfile: Dockerfile
    environment:
      OTEL_SERVICE_NAME: lotus-performance
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 25s
    logging: *default-logging

  lotus-report:
    <<: *medium-service
    build:
      context: ${LOTUS_REPORT_REPO_PATH}
      dockerfile: Dockerfile
    depends_on:
      lotus-core-query:
        condition: service_healthy
      lotus-performance:
        condition: service_healthy
      lotus-report-postgres:
        condition: service_healthy
    environment:
      LOTUS_CORE_QUERY_BASE_URL: http://lotus-core-query:8001
      LOTUS_PERFORMANCE_BASE_URL: http://lotus-performance:8000
      REPORT_JOB_LEDGER_DATABASE_URL: postgresql://${LOTUS_REPORT_POSTGRES_USER:-lotus_report}:${LOTUS_REPORT_POSTGRES_PASSWORD:?run platform-stack/bootstrap.ps1 or bootstrap.sh}@lotus-report-postgres:5432/${LOTUS_REPORT_POSTGRES_DB:-lotus_report}
      CONTRACT_VERSION: v1
      OTEL_SERVICE_NAME: lotus-report
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8300/health/ready', timeout=5)"]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 20s
    logging: *default-logging

  lotus-idea:
    <<: *medium-service
    build:
      context: ${LOTUS_IDEA_REPO_PATH}
      dockerfile: Dockerfile
    environment:
      LOTUS_CORE_BASE_URL: http://lotus-core-control:8002
      LOTUS_CORE_QUERY_BASE_URL: http://lotus-core-query:8001
      LOTUS_PERFORMANCE_BASE_URL: http://lotus-performance:8000
      LOTUS_RISK_BASE_URL: http://host.docker.internal:8130
      LOTUS_ADVISE_BASE_URL: http://host.docker.internal:8000
      LOTUS_MANAGE_BASE_URL: http://lotus-manage:8000
      LOTUS_REPORT_BASE_URL: http://lotus-report:8300
      LOTUS_AI_BASE_URL: http://host.docker.internal:8140
      OTEL_SERVICE_NAME: lotus-idea
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8330/health/ready', timeout=5)"]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 20s
    logging: *default-logging

  lotus-gateway:
    <<: *medium-service
    build:
      context: ${LOTUS_GATEWAY_REPO_PATH}
      dockerfile: Dockerfile
    depends_on:
      lotus-manage:
        condition: service_healthy
      lotus-core-query:
        condition: service_healthy
      lotus-core-control:
        condition: service_healthy
      lotus-core-ingestion:
        condition: service_healthy
      lotus-performance:
        condition: service_healthy
      lotus-report:
        condition: service_healthy
    environment:
      DECISIONING_SERVICE_BASE_URL: http://lotus-manage:8000
      PORTFOLIO_DATA_QUERY_BASE_URL: http://lotus-core-query:8001
      PORTFOLIO_DATA_CONTROL_PLANE_BASE_URL: http://lotus-core-control:8002
      PORTFOLIO_DATA_INGESTION_BASE_URL: http://lotus-core-ingestion:8000
      PERFORMANCE_ANALYTICS_BASE_URL: http://lotus-performance:8000
      REPORTING_AGGREGATION_BASE_URL: http://lotus-report:8300
      UPSTREAM_TIMEOUT_SECONDS: 15
      CONTRACT_VERSION: v1
      OTEL_SERVICE_NAME: lotus-gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health/ready', timeout=5)"]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 20s
    logging: *default-logging

  lotus-workbench:
    <<: *medium-service
    build:
      context: ${LOTUS_WORKBENCH_REPO_PATH}
      dockerfile: Dockerfile
    depends_on:
      lotus-gateway:
        condition: service_healthy
    environment:
      BFF_BASE_URL: http://lotus-gateway:8100
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging

  prometheus:
    <<: *medium-service
    image: prom/prometheus:v2.47.2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s
    logging: *default-logging

  grafana:
    <<: *medium-service
    image: grafana/grafana:10.1.5
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-lotus_operator}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run platform-stack/bootstrap.ps1 or bootstrap.sh}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards/platform:ro
      - ${LOTUS_CORE_REPO_PATH}/grafana/dashboards:/var/lib/grafana/dashboards/lotus-core:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *default-logging

  otel-collector:
    <<: *medium-service
    build:
      context: ./otel-collector
      dockerfile: Dockerfile
    depends_on:
      tempo:
        condition: service_healthy
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:${OTEL_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318"
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O", "-", "http://127.0.0.1:13133/"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s
    logging: *default-logging

  tempo:
    <<: *medium-service
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3200/ready"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging: *default-logging

volumes:
  lotus-core-postgres-data:
  lotus-manage-postgres-identity-v2-data:
  lotus-report-postgres-data:
  grafana-data:
  tempo-data:

