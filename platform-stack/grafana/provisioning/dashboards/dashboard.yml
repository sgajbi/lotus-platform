apiVersion: 1

providers:
  - name: "platform-shared-dashboards"
    orgId: 1
    folder: "Platform"
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /var/lib/grafana/dashboards/platform

  - name: "lotus-core-dashboards"
    orgId: 1
