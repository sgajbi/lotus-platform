global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

# Canonical shared Prometheus baseline for platform-stack.
# This file is platform-owned and primarily describes services orchestrated by
# lotus-platform/platform-stack. First-wave RFC-0105 reporting bridge targets
# are allowed when platform-owned dashboards and alert contracts need to observe
# reporting services that currently run from their repo-local stacks.
scrape_configs:
  - job_name: "lotus-gateway"
    static_configs:
      - targets: ["lotus-gateway:8100"]

  - job_name: "lotus-workbench"
    metrics_path: "/api/metrics"
    static_configs:
      - targets: ["lotus-workbench:3000"]

  - job_name: "lotus-core-query"
    static_configs:
      - targets: ["lotus-core-query:8001"]

  - job_name: "lotus-core-control"
    static_configs:
      - targets: ["lotus-core-control:8002"]

  - job_name: "lotus-core-ingestion"
    static_configs:
      - targets: ["lotus-core-ingestion:8000"]

  - job_name: "lotus-manage"
    static_configs:
      - targets: ["lotus-manage:8000"]

  - job_name: "lotus-performance"
    static_configs:
      - targets: ["lotus-performance:8000"]

  - job_name: "lotus-report"
    static_configs:
      - targets: ["lotus-report:8300"]

  - job_name: "lotus-idea"
    static_configs:
      - targets: ["lotus-idea:8330"]

  - job_name: "lotus-render"
    static_configs:
      - targets: ["host.docker.internal:8310"]

  - job_name: "lotus-archive"
    static_configs:
      - targets: ["host.docker.internal:8150"]

  - job_name: "lotus-risk"
    static_configs:
      - targets: ["host.docker.internal:8130"]

  - job_name: "lotus-advise"
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: "lotus-ai"
    static_configs:
      - targets: ["host.docker.internal:8140"]
